name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable v<package-version> tag reachable from main
        required: true
        type: string
      publish:
        description: Publish the same-run tested npm package and image
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mcp-promotion
  cancel-in-progress: false

jobs:
  eligibility:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      ref: ${{ steps.identity.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
      - name: Resolve eligible immutable tag before validation or credentials
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DISPATCH_REF: ${{ github.ref }}
        run: node .github/testing/candidate.mjs resolve-release

  validation:
    needs: eligibility
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.eligibility.outputs.sha }}
      source_ref: ${{ needs.eligibility.outputs.ref }}

  preflight:
    needs: [eligibility, validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.eligibility.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tested-candidate
          path: ${{ runner.temp }}/proof
      - name: Verify exact candidate and reconcile both registries before writes
        env:
          RELEASE_REF: ${{ needs.eligibility.outputs.ref }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_REPOSITORY: ${{ github.repository }}
        run: node .github/testing/candidate.mjs preflight --directory "$RUNNER_TEMP/proof/candidate" --release-ref "$RELEASE_REF"

  promote:
    if: ${{ inputs.publish == true }}
    needs: [eligibility, validation, preflight]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.eligibility.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tested-candidate
          path: ${{ runner.temp }}/proof
      - name: Repeat preflight and promote matching bytes without rebuilding
        env:
          RELEASE_REF: ${{ needs.eligibility.outputs.ref }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_REPOSITORY: ${{ github.repository }}
        run: node .github/testing/candidate.mjs promote --directory "$RUNNER_TEMP/proof/candidate" --release-ref "$RELEASE_REF"
