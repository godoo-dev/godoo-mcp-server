name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      source_sha:
        type: string
        default: ''
      source_ref:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: '0.12.5'
  NODE_VERSION: '24.22.2'

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out event source
        if: inputs.source_sha == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out immutable release source
        if: inputs.source_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: '11.1.3'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.14.7'
      - name: Install project tools
        run: pnpm install --frozen-lockfile
      # The same stages, in the same order, as `just check`; one step each so
      # timings and failures show per stage. The two odoo steps mirror odoo_majors.
      - name: Typecheck, lint, unit, Workers runtime and gate rejection checks
        run: pnpm exec just offline "$RUNNER_TEMP/offline"
      - name: Pack once and exercise the isolated installed package
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.ref }}
        run: pnpm exec just package "$RUNNER_TEMP/candidate" "$SOURCE_REF" "$RUNNER_TEMP/offline"
      - name: Build one exact candidate image without recompiling source
        run: pnpm exec just image "$RUNNER_TEMP/candidate"
      - name: Odoo18 Testcontainers through source, installed package and exact image
        run: pnpm exec just odoo "$RUNNER_TEMP/candidate" 18
      - name: Odoo19 Testcontainers through source, installed package and exact image
        run: pnpm exec just odoo "$RUNNER_TEMP/candidate" 19
      - name: Reject incomplete proof and reload the same image archive
        run: pnpm exec just archive "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tested-candidate
          path: |
            ${{ runner.temp }}/candidate
            ${{ runner.temp }}/offline
          if-no-files-found: error
          retention-days: 7

  required:
    name: required
    if: ${{ always() }}
    needs: [validation]
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly every mandatory successful result
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: test "$VALIDATION_RESULT" = success
