name: CI

on:
  workflow_dispatch:
  push:
    branches: [develop, main, "codex/**"]
  pull_request:
    branches: [develop, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]  # One-line to add 3.15+ later

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.5"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy --strict src/

      - name: Test (pytest)
        run: uv run pytest --tb=short

  package-container:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.5"

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Install package verification dependencies
        run: uv sync --frozen --all-groups

      - name: Build package artifacts
        run: uv build

      - name: Install wheel and verify packaged resources
        run: |
          uv pip install --target "$RUNNER_TEMP/wheel-site" --no-deps dist/*.whl
          sha256sum dist/*
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/wheel-site" "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY'
          import importlib.resources
          import os
          from pathlib import Path
          import godoo_mcp_server
          from godoo_mcp_server.resources import _SKILL_FILES, _SKILL_PATHS

          package = Path(godoo_mcp_server.__file__).resolve()
          assert package.is_relative_to(Path(os.environ["RUNNER_TEMP"]) / "wheel-site")
          assert godoo_mcp_server.__version__ == "0.2.0"
          assert set(_SKILL_FILES) == set(_SKILL_PATHS)
          assert all(_SKILL_FILES.values())
          bundled = importlib.resources.files("godoo_mcp_server") / "skills"
          assert (bundled / "CC0-1.0.txt").is_file()
          assert (bundled / "PROVENANCE.md").is_file()
          PY

      - name: Build container without publishing
        run: docker build --pull --tag godoo-mcp-server:ci .

      - name: Run container health check
        run: |
          docker run --rm --detach --name godoo-mcp-ci -p 127.0.0.1:8000:8000 godoo-mcp-server:ci
          trap 'docker stop godoo-mcp-ci >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(40):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=1) as response:
                      assert response.status == 200
                      break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit("container health check did not become ready")
          PY

      - name: Exercise built image against real Odoo
        run: uv run pytest -m e2e tests/e2e/test_docker_image.py --tb=short

  integration:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.5"

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Cache Odoo snapshots
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ~/.cache/godoo-testcontainers
          key: odoo-snapshot-${{ hashFiles('pyproject.toml') }}
          restore-keys: odoo-snapshot-

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run integration tests
        run: uv run pytest -m integration --tb=short
