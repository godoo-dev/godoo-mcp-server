name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      source_sha:
        type: string
        default: ''
      source_ref:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: '0.12.5'
  NODE_VERSION: '24.22.2'

jobs:
  # The stages of `just check`, built once. The Odoo majors run in parallel (the
  # matrix mirrors odoo_majors); `validation` assembles and archives the candidate.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out event source
        if: inputs.source_sha == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out immutable release source
        if: inputs.source_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: '11.1.3'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.14.7'
      - name: Install project tools
        run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, unit, Workers runtime and gate rejection checks
        run: pnpm exec just offline "$RUNNER_TEMP/offline"
      - name: Pack once and exercise the isolated installed package
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.ref }}
        run: pnpm exec just package "$RUNNER_TEMP/candidate" "$SOURCE_REF" "$RUNNER_TEMP/offline"
      - name: Build one exact candidate image without recompiling source
        run: pnpm exec just image "$RUNNER_TEMP/candidate"
      # Tar keeps modes, symlinks and dot-files that artifacts would drop.
      - name: Package the candidate and runtime bundles for the Odoo jobs
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          tar -cf "$RUNNER_TEMP/build/candidate.tar" -C "$RUNNER_TEMP" candidate offline
          tar -cf "$RUNNER_TEMP/build/dist.tar" dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build
          path: ${{ runner.temp }}/build
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  odoo:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        major: [18, 19]
    steps:
      - name: Check out event source
        if: inputs.source_sha == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out immutable release source
        if: inputs.source_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: '11.1.3'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.14.7'
      - name: Install project tools
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: build
          path: ${{ runner.temp }}/build
      - name: Unpack the built candidate and runtime bundles
        run: |
          tar -xf "$RUNNER_TEMP/build/candidate.tar" -C "$RUNNER_TEMP"
          tar -xf "$RUNNER_TEMP/build/dist.tar"
      - name: Odoo${{ matrix.major }} Testcontainers through source, installed package and exact image
        run: pnpm exec just odoo "$RUNNER_TEMP/candidate" ${{ matrix.major }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: odoo-${{ matrix.major }}
          path: |
            ${{ runner.temp }}/candidate/odoo-${{ matrix.major }}.json
            ${{ runner.temp }}/candidate/odoo-${{ matrix.major }}-*
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  validation:
    needs: [build, odoo]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out event source
        if: inputs.source_sha == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out immutable release source
        if: inputs.source_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: '11.1.3'
      - name: Install project tools
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: build
          path: ${{ runner.temp }}/build
      - name: Unpack the built candidate and runtime bundles
        run: |
          tar -xf "$RUNNER_TEMP/build/candidate.tar" -C "$RUNNER_TEMP"
          tar -xf "$RUNNER_TEMP/build/dist.tar"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: odoo-*
          merge-multiple: true
          path: ${{ runner.temp }}/candidate
      - name: Reject incomplete proof and reload the same image archive
        run: pnpm exec just archive "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tested-candidate
          path: |
            ${{ runner.temp }}/candidate
            ${{ runner.temp }}/offline
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  required:
    name: required
    if: ${{ always() }}
    needs: [build, odoo, validation]
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly every mandatory successful result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          ODOO_RESULT: ${{ needs.odoo.result }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: test "$BUILD_RESULT" = success && test "$ODOO_RESULT" = success && test "$VALIDATION_RESULT" = success
