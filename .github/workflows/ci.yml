name: CI

on:
  workflow_dispatch:
    inputs:
      qualify19:
        description: Qualify the same tested18 candidate on Odoo19 (optional)
        type: boolean
        default: false
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_call:
    inputs:
      source_sha:
        type: string
        default: ''
      source_ref:
        type: string
        default: ''
      qualify19:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: '0.12.5'
  PYTHON_VERSION: '3.14.8'

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: scripts/check.py offline --evidence-dir "$RUNNER_TEMP/offline"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-proof
          path: ${{ runner.temp }}/offline

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build and exercise one wheel in an isolated consumer
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.ref }}
        run: scripts/check.py package --candidate-dir "$RUNNER_TEMP/candidate" --source-ref "$SOURCE_REF"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-wheel
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error

  odoo18:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-wheel
          path: ${{ runner.temp }}/candidate
      - name: Observe18, users/ACLs/interrupted writes, and the exact candidate image
        env:
          ODOO_VERSION: '18.0'
        run: scripts/check.py odoo18 --candidate-dir "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-candidate
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: odoo18-failure
          path: |
            ${{ runner.temp }}/candidate/*.xml
            ${{ runner.temp }}/candidate/*-tmp
            ${{ runner.temp }}/candidate/*facts*

  archive:
    needs: odoo18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tested-candidate
          path: ${{ runner.temp }}/candidate
      - name: Verify transferred tested bytes and loaded image without publication
        run: |
          python scripts/candidate.py verify --candidate-dir "$RUNNER_TEMP/candidate"
          docker load --input "$RUNNER_TEMP/candidate/image.tar"
          python scripts/candidate.py verify --candidate-dir "$RUNNER_TEMP/candidate" --loaded-image

  required:
    name: required
    if: ${{ always() }}
    needs: [offline, package, odoo18, archive, odoo19]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Require exactly every mandatory successful result
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUESTED19: ${{ inputs.qualify19 == true }}
        run: python scripts/candidate.py required

  odoo19:
    if: ${{ inputs.qualify19 == true }}
    needs: [offline, package, odoo18]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tested-candidate
          path: ${{ runner.temp }}/candidate
      - name: Explicit optional19 qualification of the same wheel/image
        env:
          ODOO_VERSION: '19.0'
        run: scripts/check.py odoo19 --candidate-dir "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: optional19-proof
          path: |
            ${{ runner.temp }}/candidate/odoo19*
