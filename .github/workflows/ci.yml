name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]  # One-line to add 3.15+ later

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy --strict src/

      - name: Test (pytest)
        run: uv run pytest --tb=short

  integration:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache Odoo snapshots
        uses: actions/cache@v4
        with:
          path: ~/.cache/godoo-testcontainers
          key: odoo-snapshot-${{ hashFiles('pyproject.toml') }}
          restore-keys: odoo-snapshot-

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run integration tests
        run: uv run pytest -m integration --tb=short
