[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[project]
name = "godoo-mcp-server"
version = "0.2.0"
description = "Stateless MCP server for Odoo — raw primitives + skill resources"
readme = "README.md"
license = { text = "LGPL-3.0-or-later" }
requires-python = ">=3.14"
dependencies = [
    "fastmcp==4.1.4",
    "mcp==2.3.0",
    "godoo-client @ https://github.com/godoo-dev/godoo-py/archive/f7a17cfab47e992419e09e4624632c620801c274.tar.gz#subdirectory=packages/godoo-client&sha256=90409c879a047e8a024f6df9f73e24b7bdc7fc08ec7d3ad48573fdf1edfe3cdf",
    "cachetools>=7,<8",
    "obstore>=0.12.1,<0.13",
    "markdown-it-py>=4,<5",
]

[project.scripts]
godoo-mcp-server = "godoo_mcp_server.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.1",
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pre-commit>=4",
    "ruff>=0.15",
    "godoo-testcontainers>=0.2,<0.4",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = []

# Keep formatting scoped to Python files; Markdown snippets were not formatted
# by the previous Ruff version and include retained historical examples.
[tool.ruff.format]
exclude = ["*.md"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "godoo.client.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "godoo.testcontainers.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -m 'not integration and not e2e'"
markers = [
    "integration: marks tests as requiring a live Odoo container (deselect with -m 'not integration')",
    "e2e: marks tests as requiring Docker + claude CLI + Claude auth (deselect with -m 'not e2e')",
]

[tool.uv_build]
include = ["src/godoo_mcp_server/skills/**"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
