[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "godoo-mcp-server"
version = "0.1.0"
description = "Stateless MCP server for Odoo — raw primitives + skill resources"
readme = "README.md"
license = { text = "LGPL-3.0-or-later" }
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.3,<4",
    "godoo-client>=0.2,<0.3",
    "cachetools>=7,<8",
]

[dependency-groups]
dev = [
    "mypy>=2.1",
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pre-commit>=4",
    "ruff>=0.15",
    "godoo-testcontainers>=0.2,<0.3",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = []

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "godoo.client.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "godoo.testcontainers.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -m 'not integration'"
markers = [
    "integration: marks tests as requiring a live Odoo container (deselect with -m 'not integration')",
]
